<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurateur PC - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .error-message { display: none; }
        .error-message.show { display: block; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md">
        <div class="bg-gray-800 shadow-lg rounded-lg p-8">
            <h1 class="text-3xl font-bold text-center text-white mb-4">🖥️ Configurateur PC</h1>
            
            <div class="border-b border-gray-700 mb-6">
                <nav class="flex justify-around -mb-px" aria-label="Tabs">
                    <button class="tab-btn w-1/2 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-indigo-400 border-indigo-400" data-tab="login">
                        Connexion
                    </button>
                    <button class="tab-btn w-1/2 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-gray-400 hover:text-indigo-400 hover:border-indigo-400" data-tab="register">
                        Inscription
                    </button>
                </nav>
            </div>

            <!-- Formulaire de connexion -->
            <form id="login-form" class="auth-form active">
                <div class="space-y-4">
                    <div>
                        <label for="login-email" class="block text-sm font-medium text-gray-300">Email</label>
                        <input type="email" id="login-email" required placeholder="admin@configurateurpc.com" class="mt-1 w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-300">Mot de passe</label>
                        <input type="password" id="login-password" required placeholder="admin123" class="mt-1 w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                    Se connecter
                </button>
                <div id="login-error" class="error-message mt-4 text-red-400 bg-red-900/50 p-3 rounded-lg text-center"></div>
            </form>

            <!-- Formulaire d'inscription -->
            <form id="register-form" class="auth-form">
                <div class="space-y-4">
                    <div>
                        <label for="register-name" class="block text-sm font-medium text-gray-300">Nom</label>
                        <input type="text" id="register-name" required class="mt-1 w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="register-email" class="block text-sm font-medium text-gray-300">Email</label>
                        <input type="email" id="register-email" required class="mt-1 w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="register-password" class="block text-sm font-medium text-gray-300">Mot de passe</label>
                        <input type="password" id="register-password" required minlength="6" class="mt-1 w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                    S'inscrire
                </button>
                <div id="register-error" class="error-message mt-4 text-red-400 bg-red-900/50 p-3 rounded-lg text-center"></div>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-700 text-center">
                <p class="text-sm text-gray-400"><strong>Compte démo :</strong></p>
                <p class="text-xs text-gray-500">admin@configurateurpc.com / admin123</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
